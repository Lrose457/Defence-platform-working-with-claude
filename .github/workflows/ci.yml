name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Public build-time config only — no secrets are needed to build.
      NEXT_PUBLIC_USE_DEMO_DATA: "true"
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Secret scan
        run: |
          # The repo is public: fail CI if any key-shaped secret is committed.
          # Scans the working tree only — history is known to contain two
          # already-dead keys (see SECURITY.md); full-history scanning is a
          # documented follow-up (gitleaks + .gitleaksignore).
          if git grep -nE '(sb_secret_[A-Za-z0-9_-]+|sbp_[A-Za-z0-9]{40,}|sk_live_[A-Za-z0-9]+|whsec_[A-Za-z0-9]+|BSS_API_TOKEN=[A-Za-z0-9_-]{32,})' -- . ; then
            echo "::error::Key-shaped secret found in committed files"
            exit 1
          fi
          echo "No key-shaped secrets in committed files."

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # Renders the production build and asserts key routes ship real data, not
  # just 200s — this is the check that would have caught the revoked-anon-key
  # outage (every page 200 but content-less). The Supabase values below are
  # the publishable URL/key by design: they are already public in the site's
  # browser bundle and RLS enforces read-only access.
  smoke:
    runs-on: ubuntu-latest
    needs: verify
    env:
      NEXT_PUBLIC_USE_DEMO_DATA: "false"
      NEXT_PUBLIC_SUPABASE_URL: https://vzhymgmxbvegstjlmayn.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_pkuIs-IFvWbLAB_uBNFVcA__nn2u2Im
      # Ephemeral per-run token for the bearer-guarded /api/satellites refresh.
      BSS_API_TOKEN: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Serve production build
        run: |
          npm run start -- -p 3100 &
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3100/ || true)
            [ "$code" = "200" ] && break
            sleep 1
          done

      - name: Warm TLE cache
        run: |
          # CelesTrak rate-limits shared CI egress, so retry, then degrade
          # gracefully: if warming failed we still assert the status endpoint
          # responds, but skip the cache-content assertion.
          ok=0
          for attempt in 1 2 3; do
            curl -s --max-time 120 \
              -H "Authorization: Bearer $BSS_API_TOKEN" \
              "http://localhost:3100/api/satellites?refresh=1" > /dev/null
            if curl -s http://localhost:3100/api/satellites/status | grep -q '"cached":true'; then
              ok=1
              break
            fi
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            echo "TLE cache warm-up failed (likely upstream rate limit) — skipping cache-content assertion"
            echo "SMOKE_SKIP_TLE=1" >> "$GITHUB_ENV"
          fi

      - name: Smoke test
        run: BASE=http://localhost:3100 bash scripts/smoke-test.sh
