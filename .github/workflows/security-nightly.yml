name: Security nightly

# Nightly security regression gate.
#
# Three independent gates:
#   probes   — runs scripts/security-probe.sh against a live production
#              build (and the deployed site when PROD_URL is configured):
#              anon-key write denials, CSRF/bearer gates, admin redirects,
#              webhook non-disclosure, security headers, DB-backed rate
#              limiting. Fails on ANY regression.
#   advisor  — Supabase security advisor, compared against an explicit
#              allowlist of known accepted findings. Any NEW finding fails
#              the job. Requires the SUPABASE_ACCESS_TOKEN secret (a SQL-
#              scoped management token is sufficient); the job skips with a
#              warning until that secret is added.
#   gitleaks — full-history secret scan. Known-dead keys from the 2026-10
#              incident predate --since and are therefore out of scope by
#              design (see SECURITY.md runbook: history left unrewritten).
#
# Runs automatically at 02:23 UTC and on demand via workflow_dispatch.

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probes:
    runs-on: ubuntu-latest
    env:
      # Publishable config only — the same values the browser bundle ships.
      NEXT_PUBLIC_USE_DEMO_DATA: "false"
      NEXT_PUBLIC_SUPABASE_URL: https://vzhymgmxbvegstjlmayn.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_pkuIs-IFvWbLAB_uBNFVcA__nn2u2Im
      # Enables the signed-but-wrong webhook probe (verification is expected
      # to reject it; the value itself is a throwaway).
      STRIPE_WEBHOOK_SECRET: ci-probe-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Serve production build
        run: |
          npm run start -- -p 3100 &
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3100/ || true)
            [ "$code" = "200" ] && break
            sleep 1
          done

      - name: Probe local build
        run: |
          BASE=http://localhost:3100 \
          SUPABASE_URL="$NEXT_PUBLIC_SUPABASE_URL" \
          ANON_KEY="$NEXT_PUBLIC_SUPABASE_ANON_KEY" \
          bash scripts/security-probe.sh

      - name: Probe deployed site (if PROD_URL configured)
        if: env.PROD_URL != ''
        env:
          PROD_URL: ${{ vars.PROD_URL }}
        run: |
          BASE="$PROD_URL" \
          SUPABASE_URL="$NEXT_PUBLIC_SUPABASE_URL" \
          ANON_KEY="$NEXT_PUBLIC_SUPABASE_ANON_KEY" \
          bash scripts/security-probe.sh

  advisor:
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: vzhymgmxbvegstjlmayn
    steps:
      - uses: actions/checkout@v4

      - name: Check for management token
        run: |
          if [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN secret not set — advisor gate skipped. Add a SQL-scoped management token as a repo secret to enable it."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - name: Fetch security advisors and compare to allowlist
        if: env.SKIP != '1'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          curl -sS -f -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/${PROJECT_ID}/advisors/security" \
            -o /tmp/advisors.json

          python3 - <<'PY'
          import json, sys

          raw = json.load(open("/tmp/advisors.json"))
          lints = raw if isinstance(raw, list) else raw.get("lints", [])

          # Accepted residuals — each entry: (lint, identifying metadata).
          # Anything not listed here (or listed but missing) is a regression.
          ALLOWED = {
              ("rls_enabled_no_policy", "rate_limit_counters"),          # RPC-only writes, intentional
              ("anon_security_definer_function_executable", "increment_rate_limit"),
              ("anon_security_definer_function_executable", "advance_rate_limit_window"),
              ("authenticated_security_definer_function_executable", "increment_rate_limit"),
              ("authenticated_security_definer_function_executable", "advance_rate_limit_window"),
              ("authenticated_security_definer_function_executable", "is_organisation_member"),
              ("authenticated_security_definer_function_executable", "is_platform_admin"),
              ("authenticated_security_definer_function_executable", "materialise_conflicts"),
              ("authenticated_security_definer_function_executable", "user_belongs_to_organisation"),
              ("auth_leaked_password_protection", "__auth__"),           # dashboard-only fix
          }

          def entity(lint):
              for f in lint.get("findings", []):
                  md = f.get("metadata", {})
                  if md.get("type") == "auth":
                      return "__auth__"
                  if md.get("name"):
                      return md["name"]
              return "__unidentified__"

          observed = {(l["name"], entity(l)) for l in lints}

          unexpected = observed - ALLOWED
          vanished = ALLOWED - observed

          if unexpected:
              print("::error::New security advisor finding(s) — investigate before merging:")
              for name, ent in sorted(unexpected):
                  print(f"  - {name}: {ent}")
          if vanished:
              print("Resolved finding(s) — remove from the allowlist in "
                    ".github/workflows/security-nightly.yml:")
              for name, ent in sorted(vanished):
                  print(f"  - {name}: {ent}")

          sys.exit(1 if unexpected else 0)
          PY

      - name: Advisor result
        if: always() && env.SKIP != '1'
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "Advisor gate: only allowlisted findings present."
          fi

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned)
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz" \
            | tar xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan history for new secrets
        run: |
          # --since excludes the two known-dead keys from the 2026-10 incident
          # (history intentionally unrewritten — SECURITY.md runbook).
          gitleaks detect --source . --redact --verbose \
            --log-opts "--since=2026-10-07"
